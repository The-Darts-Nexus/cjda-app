function renderNightSetup() {
  // If there's an active night being entered, show its entry sheet
  if (state.activeNight) return isTeamComp(state.activeNight) ? renderDoublesComp() : renderBlockEntry();

  // Competition nights (Selected Doubles, Drawn Doubles, Mixed Triples, CoC, Home Alone Cup, …)
  // live on the Competitions tab — Night Setup is league nights only (Wednesday, DIDO).
  const isLeagueNight = n => !isCompNight(n.night_type_id);
  const submittedNights = state.nights.filter(n => isLeagueNight(n) && (n.status === 'submitted' || n.status === 'locked'))
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  const draftNights = state.nights.filter(n => isLeagueNight(n) && n.status === 'draft')
    .sort((a, b) => new Date(b.date) - new Date(a.date));

  return `
    <div style="padding:10px;display:flex;flex-direction:column;gap:10px">
      ${isAdmin() ? `
        <div class="card" style="padding:10px 12px;background:var(--green-dark);display:flex;align-items:center;justify-content:space-between">
          <div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:0.95rem;letter-spacing:0.1em">NIGHT SETUP</div>
            <div style="font-size:0.68rem;color:var(--text-muted)">Create a new league night or continue a draft</div>
          </div>
          <button class="btn btn-primary" onclick="openCreateNight()">+ Create Night</button>
        </div>` : ''}

      ${draftNights.length ? `
        <div class="card" style="overflow:hidden">
          <div style="padding:6px 12px;background:rgba(204,0,0,0.2);border-bottom:1px solid var(--border)">
            <div style="font-family:'Bebas Neue',sans-serif;font-size:0.85rem;letter-spacing:0.1em;color:#FF6666">DRAFT NIGHTS — IN PROGRESS</div>
          </div>
          <table class="data-table">
            <thead><tr><th>Date</th><th>Type</th><th>Status</th>${isAdmin()?'<th></th>':''}</tr></thead>
            <tbody>
              ${draftNights.map(n => `<tr>
                <td class="mono" style="font-size:0.78rem">${formatDate(n.date)}</td>
                <td style="color:var(--text-muted);font-size:0.75rem">${n.night_type_id ? state.nightTypes.find(nt=>nt.id===n.night_type_id)?.name||'—' : '—'}</td>
                <td><span class="pill" style="background:rgba(204,0,0,0.2);color:#FF6666;border:1px solid rgba(204,0,0,0.3)">Draft</span></td>
                ${isAdmin()?`<td><div style="display:flex;gap:4px"><button class="btn btn-ghost" style="padding:2px 8px;font-size:0.7rem" onclick="openNightEntry('${n.id}')">Continue →</button><button class="btn btn-ghost" style="padding:2px 8px;font-size:0.7rem;color:var(--red)" onclick="deleteNight('${n.id}')">🗑</button></div></td>`:''}
              </tr>`).join('')}
            </tbody>
          </table>
        </div>` : ''}

      <div class="card" style="overflow:hidden">
        <div style="padding:6px 12px;background:var(--green-dark);border-bottom:1px solid var(--border)">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:0.85rem;letter-spacing:0.1em">NIGHT HISTORY</div>
        </div>
        ${!submittedNights.length

                  <td style="color:var(--text-muted);font-size:0.75rem">${n.night_type_id ? state.nightTypes.find(nt=>nt.id===n.night_type_id)?.name||'—' : '—'}</td>

      </div>
    </div>`;
}

  7: [ [[1,6,7],[2,5,3]], [[3,4,1],[7,5,2]], [[1,4,6],[2,3,7]], [[6,4,1],[7,3,5]], [[1,2,6],[5,3,4]], [[6,2,3],[7,1,5]], [[4,2,7],[5,1,6]], [[6,7,4],[3,1,5]], [[4,7,3],[5,6,1]], [[2,7,5],[3,6,4]], [[4,5,2]] ],
  8: [ [[1,8,4],[2,7,5]], [[3,6,2],[4,5,7]], [[1,7,3],[6,8,4]], [[2,5,8],[3,4,6]], [[1,6,4],[5,7,3]], [[4,8,5],[2,3,7]], [[1,5,8],[4,6,2]], [[3,7,1],[2,8,5]], [[1,4,6],[3,5,8]], [[2,6,1],[7,8,3]], [[1,3,5],[2,4,7]], [[5,8,4],[6,7,2]], [[1,2,7],[3,8,6]], [[4,7,1],[5,6,3]] ],
  9: [ [[1,8,9],[2,7,5]], [[3,6,1],[4,5,2]], [[9,7,8],[1,6,4]], [[2,5,9],[3,4,1]], [[8,6,7],[9,5,3]], [[1,4,8],[2,3,9]], [[7,5,6],[8,4,2]], [[9,3,7],[1,2,8]], [[6,4,5],[7,3,1]], [[8,2,6],[9,1,7]], [[5,3,4],[6,2,9]], [[7,1,5],[8,9,6]], [[4,2,3],[5,1,8]], [[6,9,4],[7,8,5]], [[3,1,2],[4,9,7]], [[5,8,3],[6,7,4]], [[2,9,1],[3,8,6]], [[4,7,2],[5,6,3]] ]
};

// Name shown for a 1-based slot in the round lookup (pair formats show first names)
function playerNameForSlot(block, slotNum) {
  const slot = block && block.slots ? block.slots[slotNum - 1] : null;
  const ids = Array.isArray(slot) ? slot.filter(Boolean) : (slot ? [slot] : []);
  if (!ids.length) return `Slot ${slotNum}`;
  const names = ids.map(id => {
    const p = state.players.find(x => x.id === id);
    return p ? `${p.first_name} ${p.last_name}` : '?';
  });
  return ids.length > 1 ? names.map(n => n.split(' ')[0]).join(' / ') : names[0];
}

// "Rounds (Quick Lookup)" panel — fixed schedule + live status, per Key West
function renderRoundsLookup(blockIdx) {
  const b = state.nightBlocks[blockIdx];
  if (!b) return '';
  const N = b.size;
  const rounds = MATCH_SCHEDULES[N];
  const label = b.label || `Block ${blockIdx + 1}`;
  const per = nightMatchLegs();
  const bestOfLabel = per === 1 ? 'Single game (1 leg)' : `${per} legs per match`;

  const shell = (inner) => `
    <div class="card" style="padding:14px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px">
        <div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:0.1em;color:var(--green-accent);font-weight:700;text-transform:uppercase">Rounds (Quick Lookup)</div>
          <div style="font-size:0.72rem;color:var(--text-muted)">Block ${label} • ${bestOfLabel} • Scorer shown per match</div>
        </div>
        <div style="font-size:0.72rem;color:var(--text-muted)">${N}-player schedule</div>
      </div>
      ${inner}
    </div>`;

  if (!rounds || !rounds.length) {
    return shell(`<div style="font-size:0.75rem;color:var(--text-muted)">No predefined schedule for ${N} players.</div>`);
  }

  const legsFor = (aS, bS) => ({
    a: (b.legs[aS - 1] && b.legs[aS - 1][bS - 1]) || 0,
    z: (b.legs[bS - 1] && b.legs[bS - 1][aS - 1]) || 0
  });
  const isComplete = (a, z) => a + z === per && a !== z;
  const statusFor = (a, z) => isComplete(a, z) ? 'Complete' : (a === 0 && z === 0 ? 'Pending' : 'In Progress');

  let upNext = null;
  rounds.forEach((round, rIdx) => round.forEach((m, mIdx) => {
    if (upNext) return;
    const lg = legsFor(m[0], m[1]);
    if (statusFor(lg.a, lg.z) !== 'Complete') upNext = `${rIdx}-${mIdx}`;
  }));

  const badge = (txt, bg, fg, bd) => `<span style="display:inline-block;font-size:0.62rem;font-weight:700;letter-spacing:0.04em;padding:2px 8px;border-radius:20px;background:${bg};color:${fg};border:1px solid ${bd};white-space:nowrap">${txt}</span>`;

  const rowsHtml = rounds.map((round, rIdx) => round.map((m, mIdx) => {
    const [aS, bS, sS] = m;
    const lg = legsFor(aS, bS);
    const st = statusFor(lg.a, lg.z);
    const isUp = upNext === `${rIdx}-${mIdx}` && st !== 'Complete';
    let statusCell;
    if (isUp) statusCell = badge('UP NEXT', 'rgba(92,187,92,0.18)', 'var(--green-accent)', 'var(--green-accent)');
    else if (st === 'Complete') statusCell = badge(`COMPLETE ${lg.a}-${lg.z}`, 'rgba(45,106,45,0.25)', 'var(--green-accent)', 'var(--border)');
    else if (st === 'In Progress') statusCell = badge(`IN PROGRESS ${lg.a}-${lg.z}`, 'rgba(204,0,0,0.12)', 'var(--red-light)', 'rgba(204,0,0,0.3)');
    else statusCell = badge('PENDING', 'var(--card2)', 'var(--text-muted)', 'var(--border)');
    return `<tr>
      <td style="padding:5px 8px;text-align:center;font-family:'Share Tech Mono',monospace;font-weight:700;color:var(--text-muted);border-bottom:1px solid var(--border)">R${rIdx + 1}</td>
      <td style="padding:5px 8px;border-bottom:1px solid var(--border)">${playerNameForSlot(b, aS)} <span style="color:var(--text-muted)">vs</span> ${playerNameForSlot(b, bS)}</td>
      <td style="padding:5px 8px;color:var(--text-muted);border-bottom:1px solid var(--border)">${playerNameForSlot(b, sS)} to score</td>
      <td style="padding:5px 8px;text-align:center;border-bottom:1px solid var(--border)">${statusCell}</td>
    </tr>`;
  }).join('')).join('');

  return shell(`
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:0.74rem">
        <thead>
          <tr style="background:var(--green-dark)">
            <th style="padding:5px 8px;text-align:center;color:var(--text-muted);font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;border-bottom:1px solid var(--border)">Round</th>
            <th style="padding:5px 8px;text-align:left;color:var(--text-muted);font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;border-bottom:1px solid var(--border)">Match</th>
            <th style="padding:5px 8px;text-align:left;color:var(--text-muted);font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;border-bottom:1px solid var(--border)">Scoring</th>
            <th style="padding:5px 8px;text-align:center;color:var(--text-muted);font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;border-bottom:1px solid var(--border)">Status</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`);
}

        const chips = typeRecs.map(rec => {
          const pl = state.players.find(p => p.id === rec.playerId);
          const nm = pl ? pl.first_name : '?';
          const extra = type === 'hc' ? ` (${rec.value||'?'})` : '';
          return `<span style="display:inline-flex;align-items:center;gap:2px;background:${color};border-radius:3px;padding:1px 5px;font-size:0.65rem;margin:1px;white-space:nowrap">${nm}${extra}<span onclick="removeAccoladeRecord(${state.activeBlockIdx},${r},${rec.i})" style="cursor:pointer;color:var(--red);margin-left:2px">×</span></span>`;

      <td style="text-align:center;font-size:0.85rem;font-weight:700;color:var(--red)">${s ? s.totalPoints : ''}</td>

    </tr>`;
  }).join('');

  return `
    <div style="padding:16px;display:flex;flex-direction:column;gap:14px;max-width:1400px;margin:0 auto">

          <div>
            <h2 style="font-size:1.15rem;letter-spacing:0.08em;color:var(--text)">Night Setup (Block Sheet)</h2>

            <div style="font-size:0.74rem;color:var(--text-muted);margin-top:6px;max-width:640px;line-height:1.5">

            ${night.viewOnly && isAdmin() ? `<button class="btn btn-primary" style="font-size:0.72rem;padding:5px 10px" onclick="reopenNight('${night.id}')">Reopen Night</button>` : ''}
            ${!night.viewOnly ? `

              <button class="btn btn-primary" style="font-size:0.72rem;padding:5px 10px" onclick="saveNightDraft()">Save Draft</button>
              ${state.nightHasSavedDraft ? `
                <button class="btn btn-ghost" style="font-size:0.72rem;padding:5px 10px" onclick="restoreNightDraft()">Restore Draft</button>
                <button class="btn btn-ghost" style="font-size:0.72rem;padding:5px 10px;color:var(--red)" onclick="clearNightDraft()">Clear Draft</button>

              <label class="form-label" style="margin:0 0 0 6px">Players per block</label>
              <select class="form-input form-select" style="width:auto;font-size:0.72rem;padding:4px 22px 4px 6px" onchange="setBlockSize(${state.activeBlockIdx}, parseInt(this.value))">
                ${[3,4,5,6,7,8,9].map(n => `<option value="${n}" ${N===n?'selected':''}>${n}</option>`).join('')}
              </select>
              <button class="btn btn-ghost" style="font-size:0.72rem;padding:5px 10px" onclick="addBlock()">+ Block</button>
              <button class="btn btn-ghost" style="font-size:0.72rem;padding:5px 10px" onclick="clearActiveBlock()">Clear Block</button>
              ${state.nightBlocks.length > 1 ? `<button class="btn btn-ghost" style="font-size:0.72rem;padding:5px 10px;color:var(--red)" onclick="removeLastBlock()">- Remove Block</button>` : ''}

          ).join('')}
        </div>
      </div>

      ${renderRoundsLookup(state.activeBlockIdx)}

      ${renderDidoPlayoffs()}

      <!-- Submit -->
      ${!night.viewOnly ? `
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
          <button onclick="submitNight()" style="width:100%;padding:14px;font-size:0.9rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;background:linear-gradient(135deg,#CC0000 0%,#FF3333 100%);border:none;border-radius:6px;color:white;cursor:pointer;box-shadow:0 4px 12px rgba(204,0,0,0.3)">
            🔒 Submit Night Results

            Submit is the final trigger that pushes the night totals to History and the Season Log. Draft Save is for recovery only.
          </div>
        </div>
      ` : ''}

    </div>`;
}

            <tbody>

          <table class="data-table">
            <thead><tr><th>Date</th><th>Type</th><th>Winner</th><th></th></tr></thead>
            <tbody>
              ${completed.map(n => {
                let winner = '—';
                if (isTeamComp(n)) { winner = getDoublesWinner(n.id) || '—'; }
                else { const s = getCompStandings(n.id); winner = s.length && s[0].players.length ? s[0].players[0].name : '—'; }

function renderCompetitionEntry() {
  if (!state.activeNight) return renderCompetitions();
  if (isTeamComp(state.activeNight)) return renderDoublesComp();
  return renderBlockEntry();
}

function openCreateCompetition() {
  const today = new Date().toISOString().split('T')[0];
  const compTypes = state.nightTypes.filter(nt => !nt.counts_match_points);
  state.modal = { mode: 'create_competition', data: { date: today, night_type_id: compTypes[0]?.id || '' } };
  render();
}


async function deleteNight(nightId) {
  if (!isAdmin()) return;
  if (!confirm('Delete this night and all its results? This cannot be undone.')) return;
  try {
    await sb.from('night_attendance').delete().eq('night_id', nightId);
    await sb.from('night_playoff_matches').delete().eq('night_id', nightId);
    await sb.from('comp_matches').delete().eq('night_id', nightId);
    await sb.from('comp_teams').delete().eq('night_id', nightId);
    await sb.from('accolades').delete().eq('night_id', nightId);
    await sb.from('results').delete().eq('night_id', nightId);
    const { data: blocks } = await sb.from('blocks').select('id').eq('night_id', nightId);
    if (blocks && blocks.length) {
      await sb.from('block_players').delete().in('block_id', blocks.map(b => b.id));
    }
    await sb.from('blocks').delete().eq('night_id', nightId);
    await sb.from('nights').delete().eq('id', nightId);
    showToast('Night deleted');
    await loadAllData();
  } catch(e) {
    showToast('Error deleting: ' + e.message, 'error');
  }
}

async function deleteCompetition(nightId) {
  if (!isAdmin()) return;
  if (!confirm('Delete this competition and all its results? This cannot be undone.')) return;
  try {
    // Delete attendance, accolades, results, block_players, blocks, then night
    await sb.from('night_attendance').delete().eq('night_id', nightId);
    await sb.from('night_playoff_matches').delete().eq('night_id', nightId);
    await sb.from('comp_matches').delete().eq('night_id', nightId);
    await sb.from('comp_teams').delete().eq('night_id', nightId);
    await sb.from('accolades').delete().eq('night_id', nightId);
    await sb.from('results').delete().eq('night_id', nightId);
    const { data: blocks } = await sb.from('blocks').select('id').eq('night_id', nightId);
    if (blocks && blocks.length) {
      await sb.from('block_players').delete().in('block_id', blocks.map(b => b.id));
    }
    await sb.from('blocks').delete().eq('night_id', nightId);
    await sb.from('nights').delete().eq('id', nightId);
    showToast('Competition deleted');
    await loadAllData();
  } catch(e) {
    showToast('Error deleting: ' + e.message, 'error');
  }
}

async function saveCompetition() {
  if (!state.modal?.data?.date) { showToast('Please select a date','error'); return; }
  if (!state.modal?.data?.night_type_id) { showToast('Please select a competition type','error'); return; }
  const seasonId = getActiveSeasonId();
  const { data, error } = await sb.from('nights').insert({
    space_id: SPACE_ID, season_id: seasonId,
    night_type_id: state.modal.data.night_type_id,
    date: state.modal.data.date, status: 'draft',
    notes: state.modal.data.notes || ''
  }).select().single();
  if (error) { showToast(error.message,'error'); return; }
  showToast('Competition created!');
  state.modal = null;
  await loadAllData();
  state.tab = 'competitions';
  state.competitionNightId = data.id;
  openNightEntry(data.id);
}

async function viewCompetition(nightId) {
  state.competitionNightId = nightId;
  await viewNight(nightId);
  state.tab = 'competitions';
  render();
}

          <div style="font-family:'Bebas Neue',sans-serif;font-size:0.95rem;letter-spacing:0.1em">NIGHT TYPES</div>
        </div>
        <table class="data-table">
          <thead><tr><th>Name</th><th>Match Pts</th><th>Selection</th><th>Attendance</th></tr></thead>
          <tbody>
            ${state.nightTypes.map(nt => `
              <tr>
                <td style="font-weight:600">${nt.name}</td>
                <td><span class="pill pill-${nt.counts_match_points?'registered':'temp'}">${nt.counts_match_points?'Yes':'No'}</span></td>
                <td><span class="pill pill-${nt.contributes_selection?'registered':'temp'}">${nt.contributes_selection?'Yes':'No'}</span></td>
                <td><span class="pill pill-${nt.contributes_attendance?'registered':'temp'}">${nt.contributes_attendance?'Yes':'No'}</span></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="card" style="overflow:hidden">
        <div style="padding:8px 12px;background:var(--green-dark);border-bottom:1px solid var(--border)">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:0.95rem;letter-spacing:0.1em">SEASONS</div>
        </div>
        <table class="data-table">
          <thead><tr><th>Season</th><th>Season Points</th><th>Selection Points</th><th>Active</th></tr></thead>
          <tbody>
            ${state.seasons.map(s => `
              <tr>
                <td style="font-weight:600">${s.name}</td>
                <td class="mono" style="font-size:0.72rem">${s.season_points_start ? formatDate(s.season_points_start) + ' → ' + formatDate(s.season_points_end) : formatDate(s.start_date)}</td>
                <td class="mono" style="font-size:0.72rem">${s.selection_points_start ? formatDate(s.selection_points_start) + ' → ' + formatDate(s.selection_points_end) : '—'}</td>
                <td><span class="pill pill-${s.is_active?'registered':'temp'}">${s.is_active?'Active':'Closed'}</span></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════
// PLAYER MODAL
// ═══════════════════════════════════════════════
function openAddPlayer() {
  state.modal = { mode: 'add', data: { first_name:'', last_name:'', nickname:'', category:'men', status:'registered', dsa_number:'', email:'', phone:'' } };
  render();
}
function openEditPlayer(id) {
  // Editing moved onto the player profile page.
  openPlayerProfile(id);
  if (isAdmin()) startProfileEdit();
}
function updateModalField(field, value) {
  if (state.modal) { state.modal.data[field] = value; }
}

function renderModal() {
  if (!state.modal) return '';
  if (state.modal.mode === 'create_competition') {
    const d = state.modal.data;
    const compTypes = state.nightTypes.filter(nt => !nt.counts_match_points);
    return `
      <div class="modal-overlay" onclick="if(event.target===this)state.modal=null;render()">
        <div class="modal" onclick="event.stopPropagation()">
          <div style="padding:14px 16px;background:var(--green-dark);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
            <div style="font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:0.1em">CREATE COMPETITION</div>
            <button class="btn btn-ghost" style="padding:2px 8px" onclick="state.modal=null;render()">✕</button>
          </div>
          <div style="padding:16px;display:flex;flex-direction:column;gap:12px">
            <div>
              <label class="form-label">Date *</label>
              <input class="form-input" type="date" value="${d.date}" oninput="updateModalField('date',this.value)">
            </div>
            <div>
              <label class="form-label">Competition Type *</label>
              <select class="form-input form-select" onchange="updateModalField('night_type_id',this.value)">
                ${compTypes.map(nt => `<option value="${nt.id}" ${d.night_type_id===nt.id?'selected':''}>${nt.name}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="form-label">Section / label (optional)</label>
              <input class="form-input" value="${d.notes||''}" oninput="updateModalField('notes',this.value)" placeholder="e.g. Men, Ladies">
            </div>
            <div style="display:flex;gap:8px;justify-content:flex-end">
              <button class="btn btn-ghost" onclick="state.modal=null;render()">Cancel</button>
              <button class="btn btn-primary" onclick="saveCompetition()">Create Competition</button>
            </div>
          </div>
        </div>
      </div>`;
  }

    if (state.modal.mode === 'add_gdf_event') {
    const d = state.modal.data;
    return `<div class="modal-overlay" onclick="if(event.target===this)state.modal=null;render()">
      <div class="modal" onclick="event.stopPropagation()">
        <div style="padding:14px 16px;background:var(--green-dark);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:0.1em">ADD GDF EVENT</div>
          <button class="btn btn-ghost" style="padding:2px 8px" onclick="state.modal=null;render()">✕</button>
        </div>
        <div style="padding:16px;display:flex;flex-direction:column;gap:12px">
          <div>
            <label class="form-label">Event Name *</label>
            <input class="form-input" value="${d.name||''}" oninput="updateModalField('name',this.value)" placeholder="e.g. JHB Open 2026">
          </div>
          <div style="display:flex;gap:10px">
            <div style="flex:1">
              <label class="form-label">Start Date *</label>
              <input class="form-input" type="date" value="${d.date}" oninput="updateModalField('date',this.value)">
            </div>
            <div style="flex:1">
              <label class="form-label">End Date</label>
              <input class="form-input" type="date" value="${d.end_date||''}" min="${d.date||''}" oninput="updateModalField('end_date',this.value)">
            </div>
          </div>
          <div>
            <label class="form-label">Event Type</label>
            <select class="form-input form-select" onchange="updateModalField('event_type',this.value)">
              <option value="johannesburg" ${d.event_type==='johannesburg'?'selected':''}>Johannesburg</option>
              <option value="gauteng" ${d.event_type==='gauteng'?'selected':''}>Gauteng</option>
            </select>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button class="btn btn-ghost" onclick="state.modal=null;render()">Cancel</button>
            <button class="btn btn-primary" onclick="saveGdfEvent()">Add Event</button>
          </div>
        </div>
      </div>
    </div>`;
  }

    if (state.modal.mode === 'create_night') {
    const d = state.modal.data;
    return `
      <div class="modal-overlay" onclick="if(event.target===this)state.modal=null;render()">
        <div class="modal" onclick="event.stopPropagation()">
          <div style="padding:14px 16px;background:var(--green-dark);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
            <div style="font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:0.1em">CREATE NIGHT</div>
            <button class="btn btn-ghost" style="padding:2px 8px" onclick="state.modal=null;render()">✕</button>
          </div>
          <div style="padding:16px;display:flex;flex-direction:column;gap:12px">
            <div>
              <label class="form-label">Night Date *</label>
              <input class="form-input" type="date" value="${d.date}" oninput="updateModalField('date',this.value)">
            </div>
            <div>
              <label class="form-label">Night Type *</label>
              <select class="form-input form-select" onchange="updateModalField('night_type_id',this.value)">
                ${state.nightTypes.map(nt => `<option value="${nt.id}" ${d.night_type_id===nt.id?'selected':''}>${nt.name}${nt.counts_match_points?' (League)':' (Competition)'}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="form-label">Notes (optional)</label>
              <input class="form-input" value="${d.notes||''}" oninput="updateModalField('notes',this.value)" placeholder="Any notes for this night">
            </div>
            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px">
              <button class="btn btn-ghost" onclick="state.modal=null;render()">Cancel</button>
              <button class="btn btn-primary" onclick="saveNight()">Create Night</button>
            </div>
          </div>
        </div>
      </div>`;
  }
  const d = state.modal.data;
  const isEdit = state.modal.mode === 'edit';
  const canEditStatus = isAdmin();
  return `
    <div class="modal-overlay" onclick="if(event.target===this)state.modal=null;render()">
      <div class="modal" onclick="event.stopPropagation()">
        <div style="padding:14px 16px;background:var(--green-dark);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:0.1em">${isEdit?'EDIT PLAYER':'ADD PLAYER'}</div>
          <button class="btn btn-ghost" style="padding:2px 8px" onclick="state.modal=null;render()">✕</button>
        </div>
        <div style="padding:16px;display:flex;flex-direction:column;gap:12px">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div>
              <label class="form-label">First Name *</label>
              <input class="form-input" value="${d.first_name||''}" oninput="updateModalField('first_name',this.value)" placeholder="First name">
            </div>
            <div>
              <label class="form-label">Last Name *</label>
              <input class="form-input" value="${d.last_name||''}" oninput="updateModalField('last_name',this.value)" placeholder="Last name">
            </div>
          </div>
          <div>
            <label class="form-label">Nick Name</label>
            <input class="form-input" value="${d.nickname||''}" oninput="updateModalField('nickname',this.value)" placeholder="Nickname / alias">
          </div>
          <div>
            <label class="form-label">Category *</label>
            <select class="form-input form-select" onchange="updateModalField('category',this.value)">
              ${['men','ladies','junior_boy','junior_girl'].map(c => `<option value="${c}" ${d.category===c?'selected':''}>${{men:'Men',ladies:'Ladies',junior_boy:'Junior (Boy)',junior_girl:'Junior (Girl)'}[c]}</option>`).join('')}
            </select>
          </div>
          ${canEditStatus ? `
          <div>
            <label class="form-label">Status</label>
            <select class="form-input form-select" onchange="updateModalField('status',this.value)">
              <option value="registered" ${d.status==='registered'?'selected':''}>Registered</option>
              <option value="temp" ${d.status==='temp'?'selected':''}>Temporary</option>
            </select>
          </div>` : ''}
          <div>
            <label class="form-label">DSA Number</label>
            <input class="form-input" value="${d.dsa_number||''}" oninput="updateModalField('dsa_number',this.value)" placeholder="DSA registration number">
          </div>
          <div>
            <label class="form-label">Email</label>
            <input class="form-input" type="email" value="${d.email||''}" oninput="updateModalField('email',this.value)" placeholder="email@example.com">
          </div>
          <div>
            <label class="form-label">Phone</label>
            <input class="form-input" value="${d.phone||''}" oninput="updateModalField('phone',this.value)" placeholder="0xx xxx xxxx">
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px">
            ${isEdit && isAdmin() ? `<button class="btn btn-ghost" style="color:var(--red)" onclick="deletePlayer('${d.id}')">Delete</button>` : ''}
            <button class="btn btn-ghost" onclick="state.modal=null;render()">Cancel</button>
            <button class="btn btn-primary" onclick="savePlayer(state.modal.data)">Save Player</button>
          </div>
        </div>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════
function render() {
  const root = document.getElementById('root');
  if (!state.user) { root.innerHTML = renderAuth(); return; }
  let pageContent = '';
  if (state.loading) {
    pageContent = `<div style="display:flex;align-items:center;justify-content:center;padding:40px;flex-direction:column;gap:12px">
      <div class="spinner" style="width:32px;height:32px;border-width:3px"></div>
      <div style="font-size:0.78rem;color:var(--text-muted)">Loading...</div>
    </div>`;
  } else {
    try {
      switch(state.tab) {
        case 'home': pageContent = renderHome(); break;
        case 'nightsetup': pageContent = renderNightSetup(); break;
        case 'seasonlog': pageContent = renderSeasonLog(); break;
        case 'players': pageContent = renderPlayers(); break;
        case 'accolades': pageContent = renderAccoladeGuide(); break;
        case 'competitions': pageContent = renderCompetitions(); break;
        case 'config': pageContent = renderConfig(); break;
        default: pageContent = renderHome();
      }
    } catch(e) {
      console.error('Render error:', e);
      pageContent = '<div style="padding:20px;background:#CC0000;color:white;border-radius:8px;margin:10px;font-family:monospace;font-size:13px"><strong>ERROR on ' + state.tab + ':</strong><br>' + e.message + '<br><br>' + (e.stack||'').split('\n').slice(0,4).join('<br>') + '</div>';
    }
  }
  root.innerHTML = renderHeader() + `<div style="max-width:1200px;margin:0 auto">${pageContent}</div>` + renderModal();
  restoreAssistantUI();
}

// Keep the Schedule Assistant register usable across full re-renders (scroll + search focus)
function restoreAssistantUI() {
  const a = state.assistant;
  if (!a || !a.open) return;
  const box = document.getElementById('assistant-scroll');
  if (box && a._scroll != null) box.scrollTop = a._scroll;
  if (a._searchFocused) {
    const s = document.getElementById('assistant-search');
    if (s) { s.focus(); const n = s.value.length; try { s.setSelectionRange(n, n); } catch(e) {} }
  }
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
(async () => {
  render();
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    state.user = session.user;
    state.role = isAdminEmail(session.user.email) ? 'admin' : 'viewer';
    await loadAllData();
  }
  render();
})();
</script>
